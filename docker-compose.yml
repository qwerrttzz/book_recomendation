services:
  redis-db:
    build: ./redis
    container_name: recommender_redis
    image: recommender_redis:latest
    ports:
      - "6379:6379"

  api:
    build: ./api
    image: recommender_api:latest
    container_name: recommender_api
    ports:
      - "8000:80"
    depends_on:
      - redis-db
    environment:
      - REDIS_HOST=redis-db